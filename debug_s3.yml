apiVersion: v1
kind: Secret
metadata:
  name: s3-test-creds
stringData:
  AWS_ACCESS_KEY_ID: "admin"
  AWS_SECRET_ACCESS_KEY: "secret"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: aws
          image: amazon/aws-cli:latest
          envFrom:
            - secretRef:
                name: s3-test-creds
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            - name: ENDPOINT
              value: "http://100.64.0.2:8333"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex
              B=test-$(date +%s)
              aws --endpoint-url $ENDPOINT s3 ls
              aws --endpoint-url $ENDPOINT s3 mb s3://$B
              echo "hello s3" | aws --endpoint-url $ENDPOINT s3 cp - s3://$B/hello.txt
              aws --endpoint-url $ENDPOINT s3 cp s3://$B/hello.txt -
              echo "S3 OK"




