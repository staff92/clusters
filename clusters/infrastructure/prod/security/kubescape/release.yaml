---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
spec:
  interval: 5m
  chart:
    spec:
      chart: kubescape-operator
      version: '1.40.3'
      sourceRef:
        kind: HelmRepository
        name: kubescape
  valuesFrom:
    - kind: ConfigMap
      name: kubescape-values
      valuesKey: values.yaml
