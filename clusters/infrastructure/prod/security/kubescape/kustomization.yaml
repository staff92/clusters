apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubescape
resources:
  - namespace.yaml
  - secret.yaml
  - repo.yaml
  - release.yaml
  - cronjobs.yaml
configMapGenerator:
  - name: kubescape-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true