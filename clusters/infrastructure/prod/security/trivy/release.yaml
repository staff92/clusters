apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-dashboard
  namespace: trivy
spec:
  interval: 1h
  chart:
    spec:
      chart: /deploy/helm/trivy-operator-dashboard
      sourceRef:
        kind: GitRepository
        name: trivy-dashboard
        namespace: trivy
  # valuesFrom:
  #   - kind: ConfigMap
  #     name: dashboard-values
  #     valuesKey: dashboard-values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy
  namespace: trivy
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy-operator 
      version: '0.35.0'
      sourceRef:
        kind: HelmRepository
        name: trivy
        namespace: trivy
  valuesFrom:
    - kind: ConfigMap
      name: trivy-values
      valuesKey: values.yaml
