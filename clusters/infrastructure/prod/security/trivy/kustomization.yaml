apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trivy
resources:
  # - secret.yaml
  - repo.yaml
  - release.yaml
  # - ingress.yaml
configMapGenerator:
  - name: trivy-values
    files:
      - values.yaml
  - name: dashboard-values
    files:
      - dashboard-values.yaml
generatorOptions:
  disableNameSuffixHash: true