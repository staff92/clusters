#
# IMPORTANT NOTE
#
# This chart inherits from k8s common library chart. You can check the default values/options here:
# https://github.com/k8s-at-home/library-charts/tree/main/charts/stable/common/values.yaml
#
#! to retrieve crowdsec api key /etc/crowdsec/local_api_credentials.yaml

image:
  # -- image repository
  repository: ghcr.io/theduffman85/crowdsec-web-ui
  # -- image pull policy
  pullPolicy: IfNotPresent
  # -- image tag
  tag: "latest"

# -- See the following files for additional environment variables:
# @default -- See below
env:
  - name: "CROWDSEC_URL"
    value: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
  - name: "CROWDSEC_LOOKBACK_PERIOD"
    value: "168h"
  - name: "DB_DIR"
    value: "/data"
  # - name: "CONFIG_FILE"
  #   value: "/app/config/config.yaml"
  - name: "CROWDSEC_USER"
    value: "${CROWDSEC_LAPI_USER}"
  - name: "CROWDSEC_PASSWORD"
    value: "${CROWDSEC_LAPI_KEY}"
  # - name: CROWDSEC_LOOKBACK_PERIOD
  #   value: "72h"

envFrom: []
#  - secretRef:
#      name: cs-web-ui-env

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    ingressClassName: "traefik"
    enabled: true
    annotations:
      #traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec-bouncer-appsec@kubernetescrd
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "crowdsec"
      gethomepage.dev/description: " Curated Threat Intelligence"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "sh-crowdsec.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=crowdsec-web-ui"
    hosts:
      - host: "crowdsec.${CLUSTER_DOMAIN}"
        paths:
          - pathType: "Prefix"
            path: /
    tls: []

persistence:
  # -- Configure persistence for data to use sqlite backend.
  # @default -- See values.yaml
  data:
    enabled: true
    mountPath: /data
    accessMode: ReadWriteOnce
    size: 350Mi
    storageClass: openebs-hostpath
    emptyDir:
      enabled: false
  # config:
  #   enabled: true
  #   type: configMap
  #   name: my-crowdsec-web-ui-config  
  #   mountPath: /app/config/config.yaml
  #   subPath: config.yaml
  #   readOnly: false



podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

controller:
  strategy: Recreate
  replicas: 1


resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi
