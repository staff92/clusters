image:
  # -- image repository
  repository: ghcr.io/theduffman85/crowdsec-web-ui
  # -- image pull policy
  pullPolicy: IfNotPresent
  # -- image tag
  tag: "latest"

# -- See the following files for additional environment variables: https://github.com/TheDuffman85/crowdsec-web-ui/blob/main/docker-compose.yml

