# @default -- See below
env:
  - name: "CROWDSEC_URL"
    value: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
  - name: "CROWDSEC_LOOKBACK_PERIOD"
    value: "168h"
  - name: "DB_DIR"
    value: "/data"
  # - name: "CONFIG_FILE"
  #   value: "/app/config/config.yaml"
  - name: "CROWDSEC_USER"
    value: "${CROWDSEC_LAPI_USER}"
  - name: "CROWDSEC_PASSWORD"
    value: "${CROWDSEC_LAPI_KEY}"
  # - name: CROWDSEC_LOOKBACK_PERIOD
  #   value: "72h"
  - name: "CONFIG_AUTH_OIDC_ISSUER_URL"
    value: "http://authelia.authelia"
    #value: "https://auth.${CLUSTER_DOMAIN}"
  - name: "CONFIG_AUTH_OIDC_CLIENT_ID"
    value: "crowdsec-web-ui"
  - name: "CONFIG_AUTH_OIDC_CLIENT_SECRET"
    value: "${VPN_SSO_SECRET}"
  - name: "CONFIG_AUTH_OIDC_SCOPE"
    value: "openid profile email"
  - name: "CONFIG_AUTH_OIDC_GROUPS_CLAIM"
    value: "groups"
  - name: "CONFIG_AUTH_OIDC_ADMIN_GROUPS"
    value: "[crowdsec_admin]"
  - name: "CONFIG_AUTH_OIDC_READ_ONLY_GROUPS"
    value: "[jelly_admin]"
  - name: "CONFIG_AUTH_OIDC_UNMATCHED_ROLE"
    value: "deny"
      # CONFIG_AUTH_OIDC_ISSUER_URL: https://idp.example.com/application/o/crowdsec/
      # CONFIG_AUTH_OIDC_CLIENT_ID: crowdsec-web-ui
      # CONFIG_AUTH_OIDC_CLIENT_SECRET: change-me
      # CONFIG_AUTH_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      # CONFIG_AUTH_OIDC_SCOPE: openid profile email
      # CONFIG_AUTH_OIDC_GROUPS_CLAIM: groups
      # CONFIG_AUTH_OIDC_ADMIN_GROUPS: '[admins]'
      # CONFIG_AUTH_OIDC_READ_ONLY_GROUPS: '[auditors]'
      # CONFIG_AUTH_OIDC_UNMATCHED_ROLE: deny



envFrom: []
#  - secretRef:
#      name: cs-web-ui-env

service:
  main:
    ports:
      http:
        port: 3000

ingress:
  main:
    ingressClassName: "traefik"
    enabled: true
    annotations:
      #traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec-bouncer-appsec@kubernetescrd
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "crowdsec"
      gethomepage.dev/description: " Curated Threat Intelligence"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "sh-crowdsec.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=crowdsec-web-ui"
      gethomepage.dev/href: "https://crowdsec.${CLUSTER_DOMAIN}"
    hosts:
      - host: "crowdsec.${CLUSTER_DOMAIN}"
        paths:
          - pathType: "Prefix"
            path: /
    tls: []

persistence:
  # -- Configure persistence for data to use sqlite backend.
  # @default -- See values.yaml
  data:
    enabled: true
    mountPath: /data
    accessMode: ReadWriteOnce
    size: 350Mi
    storageClass: openebs-hostpath
    emptyDir:
      enabled: false
  # config:
  #   enabled: true
  #   type: configMap
  #   name: my-crowdsec-web-ui-config  
  #   mountPath: /app/config/config.yaml
  #   subPath: config.yaml
  #   readOnly: false



podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: "OnRootMismatch"

controller:
  strategy: Recreate
  replicas: 1


resources:
  # requests:
  #   cpu: 15m
  #   memory: 715M
  # limits:
  #   cpu: 93m
  #   memory: 1909M
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi
