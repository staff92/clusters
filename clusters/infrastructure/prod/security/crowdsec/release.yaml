---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      version: '0.24.0'
      sourceRef:
        kind: HelmRepository
        name: crowdsec
  valuesFrom:
    - kind: ConfigMap
      name: crowdsec-values
      valuesKey: crowdsec-values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dashboard
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec-web-ui 
      version: '0.39.0'
      sourceRef:
        kind: HelmRepository
        name: dashboard
  valuesFrom:
    - kind: ConfigMap
      name: dashboard-values
      valuesKey: dashboard-values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: dashboard-crowdsec-web-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: dashboard-crowdsec-web-ui
                labels:
                  sablier.enable: "true"
                  sablier.group: crowdsec