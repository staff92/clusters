apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
resources:
  - namespace.yaml
  - repo.yaml
  - secret.yaml
  - release.yaml
configMapGenerator:
  - name: crowdsec-values
    files:
      - crowdsec-values.yaml
  - name: dashboard-values
    files:
      - dashboard-values.yaml
generatorOptions:
  disableNameSuffixHash: true