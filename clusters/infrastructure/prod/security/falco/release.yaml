---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  interval: 1h
  chart:
    spec:
      chart: falco
      version: '9.1.0'
      sourceRef:
        kind: HelmRepository
        name: falco
  valuesFrom:
    - kind: ConfigMap
      name: falco-values
      valuesKey: values.yaml
