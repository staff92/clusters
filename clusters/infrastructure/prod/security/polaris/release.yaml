---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: polaris
spec:
  interval: 1h
  chart:
    spec:
      chart: polaris
      version: '6.0.0'
      sourceRef:
        kind: HelmRepository
        name: polaris
  valuesFrom:
    - kind: ConfigMap
      name: polaris-values
      valuesKey: values.yaml
