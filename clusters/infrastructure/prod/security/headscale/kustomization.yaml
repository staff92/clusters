apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headscale
resources:
  - namespace.yaml
  - repo.yaml
  - secret.yaml
  - release.yaml
  # - secret.yaml
configMapGenerator:
  - name: headscale-values
    files:
      - values.yaml
  - name: headplane-values
    files:
      - headplane-values.yaml
generatorOptions:
  disableNameSuffixHash: true