  name: bitwardensecret-sample
spec:
  organizationId: "87ac8a11-cbc3-494d-9ac6-b3dd0111cc0d"
  secretName: headplane-credentials
  onlyMappedSecrets: true 
  map:
    - bwSecretId: "c989649c-0d42-4d71-b6a6-b4f500dac5c6"
      secretKeyName: cookieSecret
    - bwSecretId: "2ac5eb3a-1c77-4a93-b361-b4f500da8df4"
      secretKeyName: apiKey
    - bwSecretId: "195d6be7-faa3-4e5e-85e8-b4f500c49553"
      secretKeyName: clientSecret
  authToken:
    secretName: bw-auth-token
    secretKey: token