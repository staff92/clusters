---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headscale
spec:
  interval: 1h
  chart:
    spec:
      chart: headscale
      version: '0.1.3'
      sourceRef:
        kind: HelmRepository
        name: headscale
        namespace: headscale
  valuesFrom:
    - kind: ConfigMap
      name: headscale-values
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headplane
spec:
  interval: 1h
  chart:
    spec:
      chart: headplane
      version: '0.3.1'
      sourceRef:
        kind: HelmRepository
        name: headplane
        namespace: headscale
  valuesFrom:
    - kind: ConfigMap
      name: headplane-values
      valuesKey: headplane-values.yaml