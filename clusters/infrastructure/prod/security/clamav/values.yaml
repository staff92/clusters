# Default values for clamav.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  timezone: "Etc/UTC"
replicaCount: 1
image:
  registry: registry.gitlab.com
  repository: xrow-public/helm-clamav/clamav
  pullPolicy: Always
  tag: latest
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
settings:
  # Report files that exceed scan limits as infected.
  alertExceedsMax: no
  # Enable ClamAV debug logging.
  debug: no
  # Write ClamAV logs to this destination.
  logFile: /dev/null
  # Maximum number of queued client connections.
  maxConnectionQueueLength: 200
  # Maximum size of a single file to scan.
  maxFileSize: 100M
  # Maximum amount of data to scan in one request.
  maxScanSize: 400M
  # Maximum number of concurrent scan threads.
  maxThreads: 10
  # Maximum time in seconds to wait for client data.
  readTimeout: 120
  # Maximum size accepted by the INSTREAM command.
  streamMaxLength: 1000M
cronjob:
  image:
    registry: registry.gitlab.com
    repository: xrow-public/helm-clamav/kubectl
    pullPolicy: IfNotPresent
    tag: 1.10.41
  imagePullSecrets: []
  schedule: ""
  suspend: false
test:
  image:
    registry: registry.gitlab.com
    repository: xrow-public/helm-clamav/test
    pullPolicy: IfNotPresent
    tag: 1.10.41
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
podLabels: {}
podAnnotations: {}
podSecurityContext: {}
# fsGroup: 2000

## Container Security Context
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
## @param provisioning.containerSecurityContext.enabled Enable container Security Context
## @param provisioning.containerSecurityContext.runAsUser User ID for the container
## @param provisioning.containerSecurityContext.runAsNonRoot Avoid running as root User
##
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - "ALL"
service:
  type: ClusterIP
  port: 3310
  # nodePort: 30000
resources:
  requests:
    cpu: 50m
    memory: 1024Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi
livenessProbe:
  exec:
    command:
      - /bin/bash
      - -c
      - |
        echo 'PING' | nc 127.0.0.1 3310 | grep -i PONG
readinessProbe:
  exec:
    command:
      - /bin/bash
      - -c
      - |
        echo 'PING' | nc 127.0.0.1 3310 | grep -i PONG
startupProbe:
  failureThreshold: 30
  periodSeconds: 10
  exec:
    command:
      - /bin/bash
      - -c
      - |
        echo 'PING' | nc 127.0.0.1 3310 | grep -i PONG
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
#  minAvailable: 1
#  unhealthyPodEvictionPolicy: "AlwaysAllow"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
  behavior: {}
# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
topologySpreadConstraints: []
