apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clamav
resources:
  - namespace.yaml
  # - secret.yaml
  - repo.yaml
  - release.yaml
  # - ingressroute.yaml
configMapGenerator:
  - name: clamav-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true