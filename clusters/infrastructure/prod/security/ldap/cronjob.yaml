apiVersion: batch/v1
kind: CronJob
metadata:
  name: check-lldap
  namespace: lldap
spec:
  schedule: "0 8 * * *" 
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 0
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: ldap-checker
            image: alpine:latest
            command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache openldap-clients curl mailx
              RESULT=$(ldapsearch \
                -H ldap://lldap-ldap.lldap.svc.cluster.local:3890 \
                -D "uid=admin,ou=people,dc=example,dc=com" \
                -w "$LDAP_ADMIN_PASSWORD" \
                -b "ou=people,dc=example,dc=com" \
                "(uid=${LDAP_USER1_ID})" \
                dn 2>&1)
              echo "LDAP: $RESULT"
              if echo "$RESULT" | grep -q "uid=${LDAP_USER1_ID}"; then
                echo "✅ User ${LDAP_USER1_ID} find in LDAP"
              else
                echo "❌ Utilisateur ${LDAP_USER1_ID} introuvable - Envoi de l'alerte mail..."
              fi

              RESULT_GROUP=$(ldapsearch \
                -H ldap://lldap-ldap.lldap.svc.cluster.local:3890 \
                -D "uid=admin,ou=people,dc=example,dc=com" \
                -w "$LDAP_ADMIN_PASSWORD" \
                -b "ou=groups,dc=example,dc=com" \
                "(cn=$LLDAP_GROUP)" \
                dn 2>&1)

              echo "LDAP group: $RESULT_GROUP"

              if echo "$RESULT_GROUP" | grep -q "^dn: cn=$LLDAP_GROUP,"; then
                echo "✅ Groupe jelly_admin trouvé dans LDAP"
                exit 0
              else
                echo "❌ Groupe jelly_admin introuvable"
              fi

                curl \
                  --url "smtp://$SMTP_HOST:$SMTP_PORT" \
                  --user "test:test" \
                  --mail-from "$MAIL_FROM" \
                  --mail-rcpt "$MAIL_TO" \
                  --upload-file - <<EOF
              From: $MAIL_FROM
              To: $MAIL_TO
              Subject: [ALERTE] LDAP
              Content-Type: text/plain; charset=UTF-8

              Bonjour,

              Erreur dans l'annuaire LDAP.

              Details:
              - Date     : $(date)
              - Filtre   : (uid=${LDAP_USER1_ID})

              Merci de vérifier l'annuaire LDAP.

              -- 
              Kubernetes Job Monitor
              EOF

                if [ $? -eq 0 ]; then
                  echo "📧 Mail envoyé avec succès"
                else
                  echo "💥 Échec de l'envoi du mail"
                  exit 1
                fi

                exit 2
              fi
            env:
            - name: LDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-credentials
                  key: ldapUserPass
            - name: SMTP_HOST
              value: "maildev-smtp.maildev"
            - name: SMTP_PORT
              value: "1025"
            - name: MAIL_FROM
              value: "alertes@example.com"
            - name: MAIL_TO
              value: "${LDAP_USER1_EMAIL}"
            - name: LLDAP_GROUP
              value: "jelly_admin2"
      backoffLimit: 0
