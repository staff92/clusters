---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: botkube
spec:
  interval: 5m
  chart:
    spec:
      chart: robusta
      version: 'v1.14.0'
      sourceRef:
        kind: HelmRepository
        name: botkube
        namespace: botkube
  valuesFrom:
    - kind: ConfigMap
      name: botkube-values
      valuesKey: values.yaml
