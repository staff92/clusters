apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portabase
resources:
  - namespace.yaml
  - secret.yaml
  - repo.yaml
  - release.yaml
configMapGenerator:
  - name: portabase-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true
