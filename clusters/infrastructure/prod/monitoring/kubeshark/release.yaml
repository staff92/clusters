---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeshark
spec:
  interval: 1h
  chart:
    spec:
      chart: kubeshark
      version: '53.4.0'
      sourceRef:
        kind: HelmRepository
        name: kubeshark
        namespace: kubeshark
  valuesFrom:
    - kind: ConfigMap
      name: kubeshark-values
      valuesKey: values.yaml
