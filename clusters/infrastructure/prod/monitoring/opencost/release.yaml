---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencost
spec:
  interval: 1h
  chart:
    spec:
      chart: opencost
      version: '2.5.32'
      sourceRef:
        kind: HelmRepository
        name: opencost
        namespace: opencost
  valuesFrom:
    - kind: ConfigMap
      name: opencost-values
      valuesKey: values.yaml

