---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  interval: 1h
  chart:
    spec:
      chart: goldilocks
      version: '10.4.1'
      sourceRef:
        kind: HelmRepository
        name: vpa
        namespace: vpa
  valuesFrom:
    - kind: ConfigMap
      name: vpa-values
      valuesKey: values.yaml

