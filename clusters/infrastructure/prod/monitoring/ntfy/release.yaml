---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ntfy
spec:
  interval: 1h
  chart:
    spec:
      chart: ntfy
      version: '1.1.11'
      sourceRef:
        kind: HelmRepository
        name: ntfy
        namespace: ntfy
  valuesFrom:
    - kind: ConfigMap
      name: ntfy-values
      valuesKey: values.yaml

