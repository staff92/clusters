# apiVersion: v1
# kind: Namespace
# metadata:
#   name: portabase
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: portabase-agent
#   namespace: portabase
# type: Opaque
# stringData:
#   AGENT_ID: "CHANGE_ME"
#   EDGE_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portabase-agent
  namespace: portabase
data:
  TZ: "Europe/Paris"
# ---
# apiVersion: v1
# kind: PersistentVolumeClaim
# metadata:
#   name: portabase-agent-data
#   namespace: portabase
# spec:
#   storageClassName: openebs-hostpath
#   accessModes: ["ReadWriteOnce"]
#   resources:
#     requests:
#       storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portabase-agent
  namespace: portabase
  labels:
    app: portabase-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portabase-agent
  template:
    metadata:
      labels:
        app: portabase-agent
    spec:
      containers:
        - name: agent
          image: portabase/agent:latest  
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080         
          envFrom:
            - configMapRef:
                name: portabase-agent
            - secretRef:
                name: portabase-agent
          # env:
          #   - name: MA_VARIABLE
          #     value: "valeur"
          # volumeMounts:
          #   - name: data
          #     mountPath: /data            
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      # volumes:
      #   - name: data
      #     persistentVolumeClaim:
      #       claimName: portabase-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: portabase-agent
  namespace: portabase
spec:
  selector:
    app: portabase-agent
  ports:
    - name: http
      port: 80
      targetPort: http