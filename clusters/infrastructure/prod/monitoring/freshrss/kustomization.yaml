apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: freshrss
resources:
  - namespace.yaml
  - secret.yaml
  - repo.yaml
  - release.yaml
  - ingressroute.yaml
  # - ingress.yaml
configMapGenerator:
  - name: freshrss-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true