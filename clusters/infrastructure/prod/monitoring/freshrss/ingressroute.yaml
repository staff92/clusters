---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: freshrss
  namespace: media
  annotations:
    gethomepage.dev/href: "https://freshrss.${CLUSTER_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: "FreshRSS is a self-hosted RSS and Atom feed aggregator."
    gethomepage.dev/group: Media
    gethomepage.dev/icon: "sh-freshrss.png"
    gethomepage.dev/name: freshrss
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=freshrss"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`freshrss.${CLUSTER_DOMAIN}`)
      kind: Rule
      # middlewares:
      #   - name: vpn-whitelist-ip
      #     namespace: traefik
      services:
        - name: freshrss
          port: 10010