# yaml-language-server: $schema=./values.schema.json
# yaml-language-server: $schema=./values.schema.json
image:
  repository: ghcr.io/linuxserver/freshrss
  pullPolicy: IfNotPresent
  tag: 1.30.4@sha256:33bc296f96a82e40b05b174a550c6f77587029286f3343911106341a1a275f94
securityContext:
  container:
    readOnlyRootFilesystem: false
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
service:
  main:
    ports:
      main:
        port: 10010
        targetPort: 80
persistence:
  config:
    enabled: true
    mountPath: /config
    storageClass: openebs-hostpath
    size: 800Mi

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            OIDC_ENABLED: '1'
            OIDC_PROVIDER_METADATA_URL: 'https://auth.${CLUSTER_DOMAIN}/.well-known/openid-configuration'
            OIDC_CLIENT_ID: 'freshrss'
            # OIDC_CLIENT_SECRET: 'insecure_secret'
            # OIDC_CLIENT_CRYPTO_KEY: 'insecure_crypto_key'
            OIDC_REMOTE_USER_CLAIM: 'preferred_username'
            OIDC_SCOPES: 'openid groups email profile'
            OIDC_X_FORWARDED_HEADERS: 'X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto'
            OIDC_CLIENT_CRYPTO_KEY:
                secretKeyRef:
                  name: freshrss-credentials
                  key: OIDC_CLIENT_CRYPTO_KEY
                  expandObjectName: false
            OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: freshrss-credentials
                  key: OIDC_CLIENT_SECRET
                  expandObjectName: false



# -- Configure the ingresses for the chart here.
# Additional ingresses can be added by adding a dictionary key similar to the 'main' ingress.
# @default -- See below
ingress:
  main:
    # -- Enables or disables the ingress
    enabled: false
    # -- Make this the primary ingress (used in probes, notes, etc...).
    # If there is more than 1 ingress, make sure that only 1 ingress is marked as primary.
    primary: true
    # -- Ensure this ingress is always enabled.
    required: false
    #expandObjectName: false
    # -- Provide additional labels which may be required.
    labels: {}
    # -- Provide additional annotations which may be required.
    annotations: {} 
      # traefik.ingress.kubernetes.io/router.middlewares: authelia-chain-authelia-auth@kubernetescrd
    # -- Set the ingressClass that is used for this ingress.
    # Requires Kubernetes >=1.19
    ingressClassName: "traefik"
    # Defaults to primary service and primary port
    # targetSelector:
    #   # service: port
    #   main: main
    ## Configure the hosts for the ingress
    hosts: 
      - host: freshrss.${CLUSTER_DOMAIN}
        # Change httpd.web_root in the sftpgo configuration if you change the path
        paths:
          - path: /
            pathType: ImplementationSpecific
    #   - # -- Host address. Helm template can be passed.
    #     host: chart-example.local
    #     ## Configure the paths for the host
    #     paths:
    #       - # -- Path.  Helm template can be passed.
    #         path: /
    #         # -- Ignored if not kubeVersion >= 1.14-0
    #         pathType: Prefix
    #         # -- Overrides the service reference for this path, by default the selector is honored
    #         overrideService:
    #           # -- Overrides the service name reference for this path
    #           name:
    #           # -- Overrides the service port reference for this path
    #           port:
    # -- Configure TLS for the ingress. Both secretName and hosts can process a Helm template.
    # Gets ignored when clusterIssuer is filled
    tls: []
      # - myresolver
    #  - secretName: chart-example-tls
    #    certificateIssuer: ""
    #    hosts:
    #      - chart-example.local
    integrations:
      certManager:
        enabled: false
        certificateIssuer: ""
      traefik:
        enabled: true
        # Default to websecure
        entrypoints:
          - websecure
        # Ensures tls annotation is set
        forceTLS: true
        middlewares: 
          - name: vpn-whitelist-ip
            namespace: traefik
            expandObjectName: false
          # - name: 'sablier-metube'
          #   namespace: 'traefik'
          #   expandObjectName: false
        #   - name: my-middleware
        #     # Optional, by default will try to
        #     # "lookup" the namespace based on the name
        #     namespace: ""
      nginx:
        enabled: false
        themepark:
          enabled: false
          css: ""
        ipWhitelist: []
        auth:
          # empty to disable, options: "authentik" or "authelia"
          type: ""
          # Internal Domain name + port to reach the auth provider, excluding http(s)
          internalHost: ""
          # External (ingress) Domain name to reach the auth provider, excluding http(s)
          externalHost: ""
          # Optional: override default response headers
          responseHeaders: []
      homepage:
        enabled: true
        # Default: chart name
        name: "freshrss"
        # Default: chart description
        description: "FreshRSS is a self-hosted RSS and Atom feed aggregator."
        # Default: no group
        group: "Media"
        # Default: chart icon
        # icon: ""
        widget:
          enabled: false
        #   # Default: chartname
        #   type: ""
        #   # Default to ingress host 0
        #   url: ""
        #   custom:
        #     # somesetting: some value
        #   customkv:
        #     # - key: some key
        #     #   value: some value
