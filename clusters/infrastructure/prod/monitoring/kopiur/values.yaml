# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/kopia
  tag: 0.23.1@sha256:7b137cb6e53a6204d958eafb9a30547f67ecc3c8b4c39c40d22fe3726300b65a
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        protocol: http
        port: 51515

ingress:
  main:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Kopia"
      gethomepage.dev/description: "Kopia is a fast and secure open-source backup/restore tool that allows you to create encrypted snapshots of your data and save the snapshots to remote or cloud storage of your choice"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "kopia.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/name=kopia"
      traefik.ingress.kubernetes.io/router.middlewares: authelia-chain-authelia-auth@kubernetescrd
    ingressClassName: "traefik"
    hosts:
      - host: "kopia.${CLUSTER_DOMAIN}"
        paths:
          - path: /
            pathType: Prefix

kopia:
  # insecure: true
  # user: "user"
  # password: "secret"
  # # user: "user"
  # # password: "secret"
  server_username: "user"
  server_password: "secret"

workload:
  main:
    podSpec:
      # volumes:
      #   - name: host-pvcs
      #     hostPath:
      #       path: /var/openebs/local
      #       type: Directory
      containers:
        main:
          # envFrom:
          #   - secretRef:
          #       name: "kopia-credentials"
          args:
            - --without-password
            - --allow-extremely-dangerous-unauthenticated-server-on-the-network
            - --disable-csrf-token-checks
            # - --server-username={{ .Values.kopia.server_username }}
            # - --server-password={{ .Values.kopia.server_password }}
            # - --insecure
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
          # volumeMounts:
          #   - name: host-pvcs
          #     mountPath: /host-pvcs
          #     readOnly: true

persistence:
  config:
    enabled: true
    mountPath: "/config"
    storageClass: "openebs-hostpath"
    size: 1G
  cache:
    enabled: true
    mountPath: "/config/cache"
    storageClass: "openebs-hostpath"
    size: 10G
  logs:
    enabled: true
    mountPath: "/config/logs"
    storageClass: "openebs-hostpath"
    size: 1G
  rclone:
    enabled: true
    mountPath: "/config/rclone"
    storageClass: "openebs-hostpath"
    size: 10G
