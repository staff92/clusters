# yaml-language-server: $schema=./values.schema.json
image:
  repository: oci.trueforge.org/containerforge/kopia
  tag: 0.23.1@sha256:10bcb6ca0ecbaeeb81376bad6d36ad2296f4b854f858847fe12875ba5be3cb18
  pullPolicy: IfNotPresent
service:
  main:
    ports:
      main:
        protocol: http
        port: 51515

ingress:
  main:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Kopia"
      gethomepage.dev/description: "Kopia is a fast and secure open-source backup/restore tool that allows you to create encrypted snapshots of your data and save the snapshots to remote or cloud storage of your choice"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "kopia.png"
      # gethomepage.dev/pod-selector: "app.kubernetes.io/name=kopia"
      traefik.ingress.kubernetes.io/router.middlewares: authelia-chain-authelia-auth@kubernetescrd
    ingressClassName: "traefik"
    hosts:
      - host: "kopia.${CLUSTER_DOMAIN}"
        paths:
          - path: /
            pathType: Prefix

kopia:
  # insecure: true
  # user: "user"
  # password: "secret"
  # # user: "user"
  # # password: "secret"
  server_username: "user"
  server_password: "secret"

workload:
  main:
    podSpec:
      containers:
        main:
          envFrom:
            - secretRef:
                name: "kopia-credentials"
          args:
            - --allow-extremely-dangerous-unauthenticated-server-on-the-network
            # - --disable-csrf-token-checks
            # - --server-username={{ .Values.kopia.server_username }}
            # - --server-password={{ .Values.kopia.server_password }}
            # - --insecure
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false

persistence:
  config:
    enabled: true
    mountPath: "/config"
    storageClass: "openebs-hostpath"
    size: 50G
  cache:
    enabled: true
    mountPath: "/config/cache"
    storageClass: "openebs-hostpath"
    size: 10G
  logs:
    enabled: true
    mountPath: "/config/logs"
    storageClass: "openebs-hostpath"
    size: 1G
  rclone:
    enabled: true
    mountPath: "/config/rclone"
    storageClass: "openebs-hostpath"
    size: 20G