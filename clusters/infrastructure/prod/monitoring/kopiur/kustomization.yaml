apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kopiur
resources:
  # - secret.yaml
  - namespace.yaml
  - repo.yaml
  - release.yaml
  # - ingress.yaml
configMapGenerator:
  - name: kopiur-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true