---
apiVersion: v1
kind: Namespace
metadata:
  name: vidbee
  labels:
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vidbee-downloads
  namespace: vidbee
  labels:
    app.kubernetes.io/name: vidbee-downloads
    app.kubernetes.io/part-of: vidbee
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: openebs-hostpath
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vidbee-data
  namespace: vidbee
  labels:
    app.kubernetes.io/name: vidbee-data
    app.kubernetes.io/part-of: vidbee
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: openebs-hostpath
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: vidbee
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: vidbee
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: vidbee
  ports:
    - name: http
      port: 3100
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: vidbee
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: vidbee
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/part-of: vidbee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: vidbee
    spec:
      containers:
        - name: api
          image: ghcr.io/nexmoe/vidbee-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3100
              protocol: TCP
          env:
            - name: VITE_ALLOWED_HOSTS
              value: "vidbee.${CLUSTER_DOMAIN}"
            - name: VIDBEE_API_HOST
              value: "0.0.0.0"
            - name: VIDBEE_API_PORT
              value: "3100"
            - name: VIDBEE_DOWNLOAD_DIR
              value: "/data/downloads"
            - name: VIDBEE_HISTORY_STORE_PATH
              value: "/data/vidbee/vidbee.db"
          volumeMounts:
            - name: downloads
              mountPath: /data/downloads
            - name: data
              mountPath: /data/vidbee
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: vidbee-downloads
        - name: data
          persistentVolumeClaim:
            claimName: vidbee-data
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: vidbee
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: vidbee
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: vidbee
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vidbee
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: vidbee
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/part-of: vidbee
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: vidbee
    spec:
      initContainers:
        - name: wait-for-api
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until nc -z api 3100; do
                echo "waiting service api:3100...";
                sleep 2;
              done
      containers:
        - name: web
          image: ghcr.io/nexmoe/vidbee-web:latest
          imagePullPolicy: Always
          # env:
          #   - name: VITE_API_URL
          #     value: "0.0.0.0"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vidbee-ingress
  namespace: vidbee
  labels:
    app.kubernetes.io/name: vidbee-ingress
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vidbee.${CLUSTER_DOMAIN}`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: 'chain-authelia-auth'
          namespace: 'authelia'
      services:
        - name: web
          port: 3000
          scheme: http
