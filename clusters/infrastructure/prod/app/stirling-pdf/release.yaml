---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 1h
  chart:
    spec:
      chart: stirling-pdf-chart 
      version: "3.1.0"
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
  valuesFrom:
    - kind: ConfigMap
      name: stirling-pdf-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: stirling-pdf-stirling-pdf-chart
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: stirling-pdf-stirling-pdf-chart
                labels:
                  sablier.enable: "true"
                  sablier.group: my-app-group
