---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 1h
  chart:
    spec:
      chart: stirling-pdf
      version: "3.1.0"
      sourceRef:
        kind: HelmRepository
        name: stirling-pdf
  valuesFrom:
    - kind: ConfigMap
      name: stirling-pdf-values
      valuesKey: values.yaml
