apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stirling-pdf
resources:
  - namespace.yaml
  - repo.yaml
  # - secret.yaml
  # - cm.yaml
  - release.yaml
configMapGenerator:
  - name: stirling-pdf-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true