apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: irc
resources:
  - ngircd-values.yaml
  - repo.yaml
  - thelounge-config.yaml
  - release.yaml
  - ingressroutetcp.yaml
configMapGenerator:
  - name: thelounge-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true