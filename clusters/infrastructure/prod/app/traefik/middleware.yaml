---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailscale-auth
  namespace: traefik
spec:
  plugin:
    tailscale-access:
      testDomain: "http://${HEADSCALE_PRIVATE_PROBE}.net.internal"  # REQUIRED: Your Tailscale domain
      # Session Management
      sessionTimeout: "24h"             # Duration (e.g., "1h", "30m", "24h")
      # Security
      secureOnly: true                  # HTTPS-only cookies
      cookieDomain: ".${CLUSTER_DOMAIN}"      # Cookie domain restriction
      requireUserAgent: true            # Require User-Agent header
      # Development
      allowLocalhost: true              # Localhost bypass
      enableDebugLogging: false         # Debug output
      # Customization
      customErrorMessage: "Custom error message"
      successMessage: "Custom success message"
      customCSS: |
        /* Company branding */
        body {
          background: linear-gradient(135deg, #1e3a8a 0%, #3730a3 100%);
        }
        .verification-card {
          border-top: 5px solid #f59e0b;
        }
        .header h1 {
          color: #1e3a8a;
        }
      customScript: |
        // Custom analytics or additional logic
        console.log('Company Tailscale verification loaded');
        // gtag('event', 'tailscale_verification_started');

