apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mattermost
resources:
  - namespace.yaml
  - repo.yaml
  - secret.yaml
  - release.yaml
  # - service.yaml
configMapGenerator:
  - name: mattermost-values
    files:
      - values.yaml
  - name: postgresql-values
    files:
      - postgresql-values.yaml
generatorOptions:
  disableNameSuffixHash: true