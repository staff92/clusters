---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost
spec:
  interval: 1h
  chart:
    spec:
      chart: mattermost
      version: '2.8.1'
      sourceRef:
        kind: HelmRepository
        name: mattermost
  valuesFrom:
    - kind: ConfigMap
      name: mattermost-values
      valuesKey: values.yaml

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: postgresql
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values
      valuesKey: postgresql-values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost-push-proxy
spec:
  interval: 1h
  chart:
    spec:
      chart: mattermost-push-proxy
      version: '0.14.3'
      sourceRef:
        kind: HelmRepository
        name: mattermost
  valuesFrom:
    - kind: ConfigMap
      name: push-values
      valuesKey: push-values.yaml