---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 1h
  chart:
    spec:
      chart: postgresql
      version: '2.8.1'
      sourceRef:
        kind: HelmRepository
        name: postgresql
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values
      valuesKey: values.yaml

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 1h
  chart:
    spec:
      chart: postgresql
      version: '18.8.13'
      sourceRef:
        kind: HelmRepository
        name: postgresql
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values
      valuesKey: values.yaml