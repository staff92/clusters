global:
  # REQUIRED: URL users will access Mattermost at
  siteUrl: "https://chat.${CLUSTER_DOMAIN}"
  # OPTIONAL: Mattermost Enterprise license
  # Option 1: Provide license content directly
  mattermostLicense: ""
  # Option 2: Use an existing secret
  existingLicenseSecret:
    name: ""
    key: ""

  features:
    database:
      # Database connection is required. Provide connection details below.
      driver: "postgres" # postgres
      dataSource: ""
      # postgres://postgres:test123@my-postgresql.chat:5432/mattermost?connect_timeout=10% # Connection string - REQUIRED
      dataSourceReplicas: [] # Optional read replicas
      # Use an existing secret for database credentials (see secret-mattermost-dbsecret.yaml for required fields)
      existingDatabaseSecret:
        name: mattermost-secrets
        key: mattermost-db-datasource

    fileStore:
      # External file storage is required for production deployments
      # For testing, you can use "local" driver (not recommended for production)
      driver: "local" # amazons3 (S3-compatible), local
      # S3-compatible storage configuration (when driver is "amazons3")
      url: "" # S3 endpoint (leave empty for AWS S3)
      bucket: "" # Bucket name - REQUIRED
      region: "" # AWS region (e.g., us-east-1)
      # Option 1: Provide credentials directly (values.yaml)
      accessKeyId: ""
      secretAccessKey: ""
      # Option 2: Use an existing Kubernetes Secret (recommended)
      # Example: kubectl create secret generic mattermost-s3-creds \
      #   --from-literal=accessKeyId=YOUR_KEY \
      #   --from-literal=secretAccessKey=YOUR_SECRET
      existingSecret:
        name: "" # Name of the Kubernetes Secret (e.g., "mattermost-s3-creds")
        accessKeyIdKey: "accessKeyId" # Key in the secret containing access key ID
        secretAccessKeyKey: "secretAccessKey" # Key in the secret containing secret access key

    jobserver:
      # Optional: Enable a dedicated job server for background tasks
      enabled: false
      name: jobserver
      replicaCount: 1
      strategy:
        type: Recreate
        rollingUpdate: null
      revisionHistoryLimit: 2
      service:
        name: mattermost-app-jobserver
        type: ClusterIP
      nodeSelector: {}
      affinity: {}
      tolerations: []
      extraEnv: []


# Mattermost deployment section.
mattermostApp:
  # OPTIONAL: Sizing preset that derives replicas + resource requests/limits
  # for the Mattermost app pods. Mirrors the App row of the operator's Size
  # presets (apis/mattermost/v1alpha1/clusterinstallation_sizes.go).
  # Valid values: "" (default - use replicaCount + resources below),
  # "100users", "1000users", "5000users", "10000users", "25000users".
  # When set, the preset is AUTHORITATIVE and overrides replicaCount and
  # resources below (matching the operator's behaviour). Leave empty if you
  # want to size the deployment manually.
  size: ""
  replicaCount: 1
  image:
  # mattermost/mattermost-preview
  # mattermost/mattermost-enterprise-edition
    repository: mattermost/mattermost-enterprise-edition
    #mattermost/mattermost-team-edition 
    # mattermost/mattermost-enterprise-edition
    tag: latest
    pullPolicy: IfNotPresent
  # Image pull secrets for private registries
  imagePullSecrets: []
    # - name: harbor-secret
    # - name: registry-credentials

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  revisionHistoryLimit: 2

  service:
    name: mattermost-app
    type: ClusterIP
    externalPort: 8065
    internalPort: 8065
    metricsPort: 8067
    clusterPort: 8075 # Required for cluster communication between replicas
    gossipPort: 8074 # Required for gossip protocol between replicas
    metricsName: mattermost-app-metrics

  ingress:
    enabled: true
    hosts:
      - chat.${CLUSTER_DOMAIN}
    tls: []
      # - secretName: mattermost-tls
      #   hosts:
      #     - chat.${CLUSTER_DOMAIN}
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Mattermost"
      gethomepage.dev/description: "Mattermost is an open core, self-hosted collaboration platform that offers chat, workflow automation, voice calling, screen sharing, and AI integration."
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "sh-mattermost.png"
      gethomepage.dev/pod-selector: "app.kubernetes.io/component=server"
      gethomepage.dev/href: "https://chat.${CLUSTER_DOMAIN}"
      # kubernetes.io/ingress.class: nginx
      # nginx.ingress.kubernetes.io/proxy-buffering: "on"
      # nginx.ingress.kubernetes.io/proxy-body-size: 50m
      # nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
      # nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      # nginx.ingress.kubernetes.io/configuration-snippet: |
      #   proxy_cache mattermost_cache;
      #   proxy_cache_revalidate on;
      #   proxy_cache_min_uses 2;
      #   proxy_cache_use_stale timeout;
      #   proxy_cache_lock on;
    ingressClassName: "traefik"

  autoscaling:
    # OPTIONAL: Horizontal Pod Autoscaler (HPA)
    # REQUIRES: metrics-server installed in your cluster
    # Check with: kubectl get apiservice v1beta1.metrics.k8s.io
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetMemoryUtilizationPercentage: 70
    targetCPUUtilizationPercentage: 70

  nodeSelector: {}
  affinity: {}
  tolerations: []

  securityContext: {}
    # fsGroup: 2000
    # runAsUser: 2000
    # runAsNonRoot: true

  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 300Mi

  # OPTIONAL: Database readiness init container.
  # When enabled, an init container runs before the Mattermost app container
  # starts and blocks until the database accepts connections. Mirrors the
  # operator's behaviour for external databases.
  #
  # For PostgreSQL, the chart uses pg_isready against the connection string
  # found in the database secret (key MM_CONFIG, or existingDatabaseSecret.key).
  dbReadinessCheck:
    enabled: false
    # Image used for the readiness probe.
    image: postgres:16-alpine
    imagePullPolicy: IfNotPresent
    # Optional: timeout (seconds) for each pg_isready attempt.
    timeoutSeconds: 5
    # Optional: sleep (seconds) between attempts.
    intervalSeconds: 5
    extraInitContainers: []
  #   - name: install-boards-plugin
  #     image: curlimages/curl:latest
  #     command:
  #       - sh
  #       - -c
  #       - |
  #         curl -L -o /plugins/mattermost-plugin-boards-v9.4.0.tar.gz https://github.com/mattermost/mattermost-plugin-boards/releases/download/v9.4.0/mattermost-plugin-boards-v9.4.0.tar.gz
  #     volumeMounts:
  #       - name: mattermost-plugins
  #         mountPath: /plugins
  extraVolumes: []
  extraVolumeMounts: []
  ## Additional environment variables for advanced configuration
  ## See: https://docs.mattermost.com/administration/config-settings.html
  # extraEnv: []
  envFrom: []
  #! MM_GITLABSETTINGS_ENABLE or MM_OPENIDSETTINGS_ENABLE ??
  extraEnv:
    - name: MM_FILESETTINGS_MAXFILESIZE
      value: "256000000"
    - name: MM_PLUGINSETTINGS_ENABLE
      value: "true"
    - name: MM_PLUGINSETTINGS_ENABLEUPLOADS
      value: "true"
    - name: MM_PLUGINSETTINGS_PLUGINSTATES
      value: |-
        {"com.mattermost.calls":{"Enable":false},"focalboard":{"Enable":true}}
      #value: '{\"com.mattermost.calls\":{\"Enable\":false},\"focalboard\":{\"Enable\":true}}'
    - name: MM_TEAMSETTINGS_ENABLEUSERCREATION
      value: "true"
    - name: MM_GITLABSETTINGS_ENABLE
      value: "true"
    - name: MM_GITLABSETTINGS_ID
      value: "mattermost"
    - name: MM_GITLABSETTINGS_SECRET
      valueFrom:
        secretKeyRef:
          name: mattermost-secrets
          key: mattermost-sso-client-secret
    - name: MM_GITLABSETTINGS_SCOPE
      value: "openid profile email"
    - name: MM_GITLABSETTINGS_DISCOVERYENDPOINT
      value: "https://auth.${CLUSTER_DOMAIN}/.well-known/openid-configuration"
    - name: MM_GITLABSETTINGS_BUTTONTEXT
      value: "Log in with Authelia"
    - name: MM_GITLABSETTINGS_BUTTONCOLOR
      value: "#000000"
    - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
      value: "true"
    - name: MM_EMAILSETTINGS_SMTPSERVER
      value: "${SMTP_HOST}"
    - name: MM_EMAILSETTINGS_SMTPPORT
      value: "587"
    - name: MM_EMAILSETTINGS_SMTPUSERNAME
      value: "${LDAP_USER1_EMAIL}"
    - name: MM_EMAILSETTINGS_SMTPPASSWORD
      valueFrom:
        secretKeyRef:
          name: mattermost-secrets
          key: smtp-outgoing-password
    - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
      value: "STARTTLS"
    - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
      value: "false"
    - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
      value: mattermost@${CLUSTER_DOMAIN}
    - name: MM_EMAILSETTINGS_SKIPSERVERCERTIFICATEVERIFICATION
      value: "false"
    - name: MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS
      value: "true"
    - name: MM_EMAILSETTINGS_PUSHNOTIFICATIONSERVER
      value: "https://push.mattermost.com"
      #value: "http://mattermost-push-proxy.mattermost.svc.cluster.local:8066"
  extraPodAnnotations: {}

serviceAccount:
  create: false
  name:
  annotations: {}
