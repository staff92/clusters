---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
spec:
  interval: 1h
  chart:
    spec:
      chart: flagger
      version: '1.44.0'
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: traefik
  valuesFrom:
    - kind: ConfigMap
      name: flagger-values
      valuesKey: values.yaml
