---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sablier
spec:
  interval: 1h
  chart:
    spec:
      chart: sablier
      version: '1.8.1'
      sourceRef:
        kind: HelmRepository
        name: sablier
  valuesFrom:
    - kind: ConfigMap
      name: sablier-values
      valuesKey: values.yaml