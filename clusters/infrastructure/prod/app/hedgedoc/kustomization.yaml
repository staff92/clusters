apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: doc
resources:
  - namespace.yaml
  - secret.yaml
  - repo.yaml
  - release.yaml
configMapGenerator:
  - name: doc-values
    files:
      - values.yaml
  - name: postgresql-values
    files:
      - postgresql-values.yaml
generatorOptions:
  disableNameSuffixHash: true