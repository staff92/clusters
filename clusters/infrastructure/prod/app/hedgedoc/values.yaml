# yaml-language-server: $schema=./values.schema.json
image:
  repository: quay.io/hedgedoc/hedgedoc
  pullPolicy: IfNotPresent
  tag: 1.12.0@sha256:89bd85d7817fb3e3a4aafdd85aefb0fbb20b848f6dbf1d9ee0d72fdcb76710cc
service:
  main:
    ports:
      main:
        port: 10132
persistence:
  uploads:
    storageClass: "openebs-hostpath"
    size: 10G
    enabled: true
    mountPath: "/hedgedoc/public/uploads"
cnpg:
  main:
    enabled: true
    user: hedgedoc
    database: hedgedoc

workload:
  main:
    podSpec:
      containers:
        main:
          env:
            NODE_ENV: "production"
            CMD_PORT: "{{ .Values.service.main.ports.main.port }}"
            CMD_DB_PORT: "5432"
            CMD_DB_DIALECT: "postgres"
            CMD_DB_USERNAME: "{{ .Values.cnpg.main.user }}"
            CMD_DB_DATABASE: "{{ .Values.cnpg.main.database }}"
            CMD_SESSION_SECRET:
              secretKeyRef:
                name: hedgedoc-credentials
                key: CMD_SESSION_SECRET
            CMD_DB_HOST:
              secretKeyRef:
                name: cnpg-main-urls
                key: host
            CMD_DB_PASSWORD:
              secretKeyRef:
                name: cnpg-main-user
                key: password
            # User Defined
            CMD_FORBIDDEN_NOTE_IDS: "robots.txt, favicon.ico, api, build, css, docs, fonts, js, uploads, vendor, views"
            CMD_IMAGE_UPLOAD_TYPE: "filesystem"
            CMD_SOURCE_URL: ""
            CMD_TOOBUSY_LAG: 70
            CMD_ALLOW_GRAVATAR: true
            CMD_DOMAIN: false
            CMD_ALLOW_ANONYMOUS: false
            CMD_REQUIRE_FREEURL_AUTHENTICATION: true
            CMD_EMAIL: false
            CMD_ALLOW_EMAIL_REGISTER: false
            #! OAUTH
            CMD_URL_ADDPORT: false
            CMD_PROTOCOL_USESSL: true
            CMD_OAUTH2_PROVIDERNAME: Authelia
            CMD_OAUTH2_CLIENT_ID: hedgedoc
            CMD_OAUTH2_CLIENT_SECRET:
              secretKeyRef:
                name: hedgedoc-credentials
                key: CMD_OAUTH2_CLIENT_SECRET
            CMD_OAUTH2_SCOPE: openid email profile
            CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: sub
            CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: name
            CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: email
            CMD_OAUTH2_USER_PROFILE_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/userinfo
            CMD_OAUTH2_TOKEN_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/token
            CMD_OAUTH2_AUTHORIZATION_URL: https://auth.${CLUSTER_DOMAIN}/api/oidc/authorization
            CMD_ALLOW_ORIGIN: "doc.${CLUSTER_DOMAIN}"
            # CMD_HSTS_ENABLE: true
