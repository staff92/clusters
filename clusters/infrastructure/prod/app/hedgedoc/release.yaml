---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: doc
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: doc
  valuesFrom:
    - kind: ConfigMap
      name: doc-values
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: postgresql
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values
      valuesKey: postgresql-values.yaml