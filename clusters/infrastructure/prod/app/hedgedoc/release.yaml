---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: doc
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: doc
  valuesFrom:
    - kind: ConfigMap
      name: doc-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: doc-hedgedoc
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: doc-hedgedoc
                labels:
                  sablier.enable: "true"
                  sablier.group: doc


---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: postgresql
  valuesFrom:
    - kind: ConfigMap
      name: postgresql-values
      valuesKey: postgresql-values.yaml