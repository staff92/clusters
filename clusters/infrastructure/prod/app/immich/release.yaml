---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: immich
  valuesFrom:
    - kind: ConfigMap
      name: immich-values
      valuesKey: values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-db
spec:
  interval: 1h
  chart:
    spec:
      chart: cluster
      version: '0.8.1'
      sourceRef:
        kind: HelmRepository
        name: immich-db
  valuesFrom:
    - kind: ConfigMap
      name: immich-db-values
      valuesKey: immich-db-values.yaml