apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: immich
resources:
  - namespace.yaml
  - secret.yaml
  - repo.yaml
  - release.yaml
configMapGenerator:
  - name: immich-values
    files:
      - values.yaml
  - name: immich-db-values
    files:
      - immich-db-values.yaml
generatorOptions:
  disableNameSuffixHash: true