mode: standalone
type: postgresql

cluster:
  instances: 1
  enablePDB: false
  primaryUpdateStrategy: unsupervised

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.6-0.4.3

  initdb:
    database: immich
    owner: immich

  storage:
    size: 10Gi
    storageClass: openebs-hostpath

  postgresql:
    shared_preload_libraries:
      - vchord.so


