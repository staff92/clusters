---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trillium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: trillium
  valuesFrom:
    - kind: ConfigMap
      name: trillium-values
      valuesKey: values.yaml
