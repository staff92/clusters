---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: adminer
spec:
  interval: 1h
  chart:
    spec:
      chart: adminer
      version: '1.1.0'
      sourceRef:
        kind: HelmRepository
        name: adminer
  valuesFrom:
    - kind: ConfigMap
      name: adminer-values
      valuesKey: values.yaml