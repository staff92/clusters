apiVersion: v1
kind: Namespace
metadata:
  name: rustical
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustical-data
  namespace: rustical
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustical
  namespace: rustical
  labels:
    app: rustical
spec:
  replicas: 1
  strategy:
    type: Recreate   
  selector:
    matchLabels:
      app: rustical
  template:
    metadata:
      labels:
        app: rustical
    spec:
      containers:
        - name: rustical
          image: ghcr.io/lennart-k/rustical:latest
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: RUSTICAL_FRONTEND__ALLOW_PASSWORD_LOGIN
              value: "false"
            - name: RUSTICAL_OIDC__NAME
              value: "Authelia"
            - name: RUSTICAL_OIDC__ISSUER
              value: "https://auth.${CLUSTER_DOMAIN}"
            - name: RUSTICAL_OIDC__CLAIM_USERID
              value: "preferred_username"
            - name: RUSTICAL_OIDC__SCOPES
              value: '["openid", "profile", "groups"]'
            # - name: RUSTICAL_OIDC__REQUIRE_GROUP
            #   value: "app:rustical"
            - name: RUSTICAL_OIDC__ALLOW_SIGN_UP
              value: "true"
          envFrom:
            - secretRef:
                name: rustical-oidc
          volumeMounts:
            - name: data
              mountPath: /var/lib/rustical
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustical-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustical
  namespace: rustical
spec:
  selector:
    app: rustical
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustical
  namespace: rustical
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`call.${CLUSTER_DOMAIN}`)
      kind: Rule
      services:
        - name: rustical
          port: 4000
  # tls:
  #   certResolver: letsencrypt