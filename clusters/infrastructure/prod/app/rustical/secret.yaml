    app.kubernetes.io/created-by: sm-operator
  name: bitwardensecret-sample
spec:
  organizationId: "87ac8a11-cbc3-494d-9ac6-b3dd0111cc0d"
  secretName: rustical-oidc
  onlyMappedSecrets: true 
  map:
    - bwSecretId: "5b77e1e3-39fd-4c6a-a496-b4ed00fa3523"
      secretKeyName: RUSTICAL_OIDC__CLIENT_ID
    - bwSecretId: "7399bc5e-7f0c-48db-b57d-b4ed00fa1810"
      secretKeyName: RUSTICAL_OIDC__CLIENT_SECRET
  authToken:
    secretName: bw-auth-token
    secretKey: token