apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: semaphore
resources:
  - namespace.yaml
  - repo.yaml
  - secret.yaml
  - cm.yaml
  - release.yaml
configMapGenerator:
  - name: semaphore-values
    files:
      - values.yaml
generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: Deployment
      name: semaphore
    patch: |
      - op: add
        path: /metadata/labels/sablier.enable
        value: "true"
      - op: add
        path: /spec/template/metadata/labels/sablier.enable
        value: "true"



