apiVersion: v1
kind: ConfigMap
metadata:
  name: semaphore-cm
data:
  hello.sh: |
    #!/bin/bash
    echo "Hello from Semaphore"
    date
    hostname
  restart_media_storage.yaml: |
    - hosts: all
      name: restart media stack 
      gather_facts: false
      tasks:
        - command: k0s kubectl rollout restart deployment  servarr-jellyfin servarr-lidarr servarr-qbittorrent servarr-radarr servarr-sonarr
          register: result

        - debug:
            msg: "{{ result.stdout }}"
  vaultwarden_sso_cleanup_k0s.yaml: |
      - name: clean SSO Vaultwarden (k0s)
        hosts: all
        become: true
        gather_facts: false

        vars:
          cluster_namespace: vault
          pod_name: sqlite-debug
          db_path: "/data/db.sqlite3"
          kubectl_bin: "k0s kubectl"
          manifest_tmp_path: "/tmp/debug_vault_{{ pod_name }}.yml"

          pod_manifest:
            apiVersion: v1
            kind: Pod
            metadata:
              name: "{{ pod_name }}"
              namespace: "{{ cluster_namespace }}"
              labels:
                app: sqlite-debug
            spec:
              restartPolicy: Never
              securityContext:
                runAsUser: 0
              containers:
                - name: sqlite-debug
                  image: keinos/sqlite3
                  securityContext:
                    runAsUser: 0
                  command: ["sleep", "3600"]
                  volumeMounts:
                    - mountPath: /data
                      name: data
              volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: vault-vaultwarden

        tasks: 
          - block:

            - ansible.builtin.copy:
                content: "{{ pod_manifest | to_nice_yaml(indent=2) }}"
                dest: "{{ manifest_tmp_path }}"
                mode: "0600"

            - ansible.builtin.command:
                cmd: "{{ kubectl_bin }} apply -f {{ manifest_tmp_path }}"
              register: apply_result
              changed_when: "'created' in apply_result.stdout or 'configured' in apply_result.stdout"

            - ansible.builtin.command:
                cmd: "{{ kubectl_bin }} get pod {{ pod_name }} -n {{ cluster_namespace }} -o jsonpath='{.status.phase}'"
              register: pod_phase
              until: pod_phase.stdout == "Running"
              retries: 30
              delay: 2
              changed_when: false

            - ansible.builtin.command:
                cmd: >-
                  {{ kubectl_bin }} exec -n {{ cluster_namespace }} {{ pod_name }} --
                  sqlite3 {{ db_path }} "DELETE FROM sso_auth; DELETE FROM sso_users;"
              register: cleanup_result
              changed_when: true

            - ansible.builtin.debug:
                var: cleanup_result.stdout

            always:
            - ansible.builtin.command:
                cmd: "{{ kubectl_bin }} delete pod {{ pod_name }} -n {{ cluster_namespace }} --ignore-not-found"
              changed_when: true

            - ansible.builtin.file:
                path: "{{ manifest_tmp_path }}"
                state: absent
  scan.yaml: |
      - name: Scan
        hosts: all
        gather_facts: false
        vars:
          cluster_namespace: gowitness
          kubectl_bin: "k0s kubectl"
          target_network: 
          target_port: 
          router_mac: 
          interface: 
        tasks:

        - ansible.builtin.apt:
            name: masscan
            update_cache: true
          become: true

        #TODO auto select interface + router mac 
        - ansible.builtin.command:
            cmd: "masscan {{ target_network }} -p{{ target_port }} --router-mac {{ router_mac }} --interface {{ interface }}"
          become: true
          register: scan_output

        - community.crypto.get_certificate:
            host: "{{ item.split('on')[-1].strip() }}"
            port: "{{ item.split('/')[0].split(' ')[-1]|int }}"
            asn1_base64: true
          delegate_to: localhost
          become: false
          run_once: true
          loop: "{{ scan_output.stdout_lines }}"
          ignore_errors: true
          register: cert
          tags: test

        - ansible.builtin.command: "nc -v -w 1 {{ item.split('on')[-1].strip() }} {{ item.split('/')[0].split(' ')[-1]|int }}"
          register: nc_port
          ignore_errors: true
          loop: "{{ scan_output.stdout_lines }}"

        - debug:
            msg: "{{ item }}"
          loop: "{{ nc_port.results }}"

        - ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} get pods -n {{ cluster_namespace }}
              -l app={{ cluster_namespace }}
              -o jsonpath='{.items[0].metadata.name}'
          register: pod_name_result

        - ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} exec -n {{ cluster_namespace }} {{ pod_name_result.stdout }} --
              gowitness scan single --url "https://{{ item.subject.CN }}" --write-db
          loop: "{{ cert.results }}"
          when: 
            - item.subject.CN is defined
            - "'*' not in item.subject.CN"

        - ansible.builtin.command:
            cmd: >-
              {{ kubectl_bin }} exec -n {{ cluster_namespace }} {{ pod_name_result.stdout }} --
              gowitness scan single --url "http://{{ item.invocation.module_args.host }}:{{ item.invocation.module_args.port }}" --write-db
          loop: "{{ cert.results }}"
          when: 
            - item.subject.CN is not defined
            - screenshot_all|default(false) is true
