---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tracearr
  valuesFrom:
    - kind: ConfigMap
      name: tracearr-values
      valuesKey: values.yaml
  targetNamespace: media

