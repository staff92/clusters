---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metube
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: metube
  valuesFrom:
    - kind: ConfigMap
      name: metube-values
      valuesKey: values.yaml

