---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wizarr
spec:
  interval: 5m
  chart:
    spec:
      chart: wizarr
      version: '0.1.5'
      sourceRef:
        kind: HelmRepository
        name: wizarr
  valuesFrom:
    - kind: ConfigMap
      name: wizarr-values
      valuesKey: values.yaml
