---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spotdl-music-pvc
  namespace: media
  labels:
    app.kubernetes.io/name: spotdl
spec:
  storageClassName: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotdl
  namespace: media
  labels:
    app.kubernetes.io/name: spotdl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spotdl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotdl
    spec:
      containers:
        - name: spotdl
          image: spotdl/spotify-downloader
          # spotdl.${CLUSTER_DOMAIN}  command: ["sleep", "infinity"]
          command: ["uv", "run", "--project", "/app", "--no-dev", "--frozen", "--no-sync", "spotdl", "web", "--host" ,"0.0.0.0", "--port", "8800", "--keep-alive", "--allowed-origins", "*"]
          env:
            - name: TZ
              value: "CEST"
          volumeMounts:
            - name: spotdl-music
              mountPath: /music
          ports:
            - name: http
              containerPort: 8800
              protocol: TCP
      volumes:
        - name: spotdl-music
          persistentVolumeClaim:
            claimName: spotdl-music-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: spotdl-web
  namespace: media
  labels:
    app.kubernetes.io/name: spotdl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spotdl
  ports:
    - name: http
      port: 8800
      targetPort: http
      protocol: TCP