---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spotdl-music-pvc
  namespace: media
  labels:
    app.kubernetes.io/name: spotdl
spec:
  storageClassName: openebs-hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotdl
  namespace: media
  labels:
    app.kubernetes.io/name: spotdl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spotdl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spotdl
    spec:
      containers:
        - name: spotdl
          image: spotdl/spotify-downloader
          command: ["sleep", "infinity"]
          env:
            - name: TZ
              value: "CEST"
          volumeMounts:
            - name: spotdl-music
              mountPath: /music
      volumes:
        - name: spotdl-music
          persistentVolumeClaim:
            claimName: spotdl-music-pvc
