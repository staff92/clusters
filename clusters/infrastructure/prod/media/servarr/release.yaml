---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: servarr
spec:
  interval: 5m
  chart:
    spec:
      chart: servarr
      version: '1.5.2'
      sourceRef:
        kind: HelmRepository
        name: servarr
  valuesFrom:
    - kind: ConfigMap
      name: servarr-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: servarr-seerr
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: servarr-seerr
                labels:
                  sablier.enable: "true"
                  sablier.group: seerr
          - target:
              kind: Deployment
              name: servarr-bazarr     
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: servarr-bazarr     
                labels:
                  sablier.enable: "true"
                  sablier.group: bazarr     
          - target:
              kind: Deployment
              name: servarr-lidarr  
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: servarr-lidarr  
                labels:
                  sablier.enable: "true"
                  sablier.group: lidarr


