# apiVersion: v1
# kind: Namespace
# metadata:
#   name: autothrottle
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: autothrottle-data
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-hostpath
  resources:
    requests:
      storage: 1Gi
# Optionnel : identifiants (prioritaires sur l'UI web)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: autothrottle-auth
#   namespace: media
# type: Opaque
# stringData:
#   AUTH_USERNAME: admin
#   AUTH_PASSWORD: changeme
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autothrottle
  namespace: media
  labels:
    app: autothrottle
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autothrottle
  template:
    metadata:
      labels:
        app: autothrottle
    spec:
      containers:
        - name: autothrottle
          image: jaimistry/autothrottle:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 7676
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Paris
            - name: AUTH_DISABLED
              value: "true"
            # - name: AUTH_USERNAME
            #   valueFrom:
            #     secretKeyRef:
            #       name: autothrottle-auth
            #       key: AUTH_USERNAME
            # - name: AUTH_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: autothrottle-auth
            #       key: AUTH_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autothrottle-data
---
apiVersion: v1
kind: Service
metadata:
  name: autothrottle
  namespace: media
spec:
  selector:
    app: autothrottle
  ports:
    - name: http
      port: 7676
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: autothrottle
  namespace: media
  annotations:
    #traefik.ingress.kubernetes.io/router.middlewares: authelia-chain-authelia-auth@kubernetescrd
    gethomepage.dev/href: "https://auto.${CLUSTER_DOMAIN}"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: "Intelligently throttles download clients while a media server has active playback."
    gethomepage.dev/group: Media
    gethomepage.dev/icon: "sh-jellyfin.png"
    #gethomepage.dev/app: autothrottle # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/name: throttle
    gethomepage.dev/pod-selector: "app=autothrottle"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`auto.${CLUSTER_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: 'vpn-whitelist-ip'
          namespace: 'traefik'
      services:
        - name: autothrottle
          port: 7676